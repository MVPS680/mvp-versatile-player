[workspace]
resolver = "2"
members = [
    "crates/mvp-core",
    "crates/mvp-platform",
    "crates/mvp-player",
    "crates/mvp-subtitle",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "MVP-Versatile-Player - a versatile FFmpeg-powered audio/video/image player for Windows"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
bitflags = "2.6"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
encoding_rs = "0.8"
walkdir = "2.5"
bytemuck = "1.21"

# FFI / platform
windows = "0.62"

# FFmpeg
ffmpeg-next = "9.0.0"

# Media
cpal = "0.16"
image = "0.25"

# GUI
# `default_fonts` is off on purpose, in both places: egui's own `default`
# feature re-enables it, so turning it off only on `eframe` would silently do
# nothing. The player installs the Windows system stack itself (see
# `theme::install_fonts`); shipping Ubuntu-Light/Hack as well would both bloat
# the binary and sit in front of the CJK font as a mismatched fallback.
eframe = { version = "0.32", default-features = false, features = ["glow"] }
egui = { version = "0.32", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# --- Release profile tuned for start-up latency and small, fast binaries -------
# NOTE: unwinding panics are kept (not `panic = "abort"`) on purpose: the media
# engine runs on worker threads and must be able to contain a panic triggered by
# a damaged file without taking the whole player down.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"
debug = false
overflow-checks = false

# The player's own UI code stays at a sane opt level while dependencies get the
# full treatment, which keeps `cargo build` (dev) usable for UI iteration.
[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.mvp-core]
opt-level = 2
